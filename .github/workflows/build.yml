name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: Repetidor, servicio de cuentas y web para el VPS
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release -p mestisexo-core -p mestisexo-auth --bin mestisexo-repeater --bin mestisexo-auth --target x86_64-unknown-linux-musl
          mkdir -p target/vps && rm -rf target/web && cp -r ui target/web
          tar -czf target/vps/mestisexo-vps-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release mestisexo-repeater mestisexo-auth \
            -C "$GITHUB_WORKSPACE/deploy" . \
            -C "$GITHUB_WORKSPACE/target" web

      - uses: actions/upload-artifact@v4
        with:
          name: mestisexo-vps
          path: target/vps/*.tar.gz

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/vps/*.tar.gz
