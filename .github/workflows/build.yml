name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-musl' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar
        working-directory: app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Repetidor para el VPS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          cargo build --release -p mestisexo-core --bin mestisexo-repeater --target x86_64-unknown-linux-musl
          mkdir -p target/repeater
          tar -czf target/repeater/mestisexo-repeater-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release mestisexo-repeater \
            -C "$GITHUB_WORKSPACE/deploy" mestisexo-repeater.service 50-mestisexo-stream.conf

      - uses: actions/upload-artifact@v4
        with:
          name: mestisexo-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/repeater/*.tar.gz

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/repeater/*.tar.gz
