name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-musl' || runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar
        working-directory: app
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Nombre del .dmg
        if: runner.os == 'macOS'
        run: |
          for f in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            mv "$f" "${f%_universal.dmg}_macos-universal.dmg"
          done

      - name: Repetidor para el VPS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          cargo build --release -p mestisexo-core -p mestisexo-auth --bin mestisexo-repeater --bin mestisexo-auth --target x86_64-unknown-linux-musl
          mkdir -p target/repeater
          rm -rf target/web && cp -r ui target/web
          tar -czf target/repeater/mestisexo-repeater-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release mestisexo-repeater mestisexo-auth \
            -C "$GITHUB_WORKSPACE/deploy" . \
            -C "$GITHUB_WORKSPACE/target" web

      - uses: actions/upload-artifact@v4
        with:
          name: mestisexo-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/repeater/*.tar.gz

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/repeater/*.tar.gz

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: mestisexo
        run: |
          cargo tauri android build --apk
          mkdir -p ../target/apk
          cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "../target/apk/Mestisexo_${GITHUB_REF_NAME#v}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mestisexo-android
          path: target/apk/*.apk

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/apk/*.apk
