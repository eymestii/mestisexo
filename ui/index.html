<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <title>Mestisexo</title>
  <link rel="stylesheet" href="style.css?v=0.5.0">
</head>
<body>
  <section id="host-setup" class="screen hidden">
    <h2>Transmitir</h2>
    <label>Puerto local <input id="ws-port" type="number" min="1" max="65535" value="8090"></label>
    <label>Puerto RTMP (OBS) <input id="rtmp-port" type="number" min="1" max="65535" value="1935"></label>
    <label>VPS <input id="vps" placeholder="stream@109.123.252.126" autocomplete="off"></label>
    <label>Clave SSH del VPS <input id="vps-key" placeholder="~/.ssh/mestisexo_tunnel" autocomplete="off"></label>
    <div class="keys">
      <div><span>Clave de stream (OBS)</span><code id="k-stream" class="secret"></code><button id="regen-stream">Nueva</button></div>
      <p class="muted">Es fija entre sesiones. Si generas una nueva, tendrás que pegarla otra vez en OBS.</p>
      <div><span>Servidor (OBS)</span><code id="k-rtmp"></code><button data-copy="k-rtmp">Copiar</button></div>
      <div><span>Enlace para espectadores</span><code id="k-web"></code><button data-copy="k-web">Copiar</button></div>
    </div>
    <div class="row">
      <button id="start" class="primary">Iniciar sesión</button>
    </div>
    <p id="host-error" class="error"></p>
  </section>

  <section id="live" class="hidden">
    <header>
      <button id="leave" class="hidden">Salir</button>
      <span id="badge" class="badge">OFFLINE</span>
      <span id="uptime" class="hidden"></span>
      <span id="viewers">0 espectadores</span>
      <span id="quality-indicator" class="quality-indicator hidden"></span>
      <div id="health" class="health hidden">
        <span id="h-obs" class="pill">OBS</span>
        <span id="h-rate" class="pill">— kbps</span>
        <span id="h-tunnel" class="pill hidden">Túnel</span>
        <span id="h-quality" class="pill hidden" title="Calidad de conexión de espectadores">Calidad</span>
      </div>
    </header>
    <div class="main">
      <div class="left">
        <div class="player">
          <video id="video" autoplay playsinline></video>
          <div id="placeholder">Esperando señal…</div>
          <div id="login-panel" class="login hidden">
            <p id="login-msg"></p>
            <button id="login-discord" class="primary">Iniciar sesión con Discord</button>
            <button id="login-invite" class="hidden">Unirme al servidor</button>
          </div>
        </div>
      </div>
      <aside class="chat">
        <div class="chat-head">
          <b>Chat</b>
        </div>
        <div id="account" class="account hidden">
          <span id="account-sub" class="sub hidden" title="Suscriptor">SUB</span>
          <b id="account-name"></b>
          <button id="subscribe" class="primary hidden">Suscribirse · 2,99 $/mes</button>
          <button id="logout">Salir de Discord</button>
        </div>
        <ul id="messages"></ul>
        <form id="chat-form">
          <input id="chat-input" maxlength="300" placeholder="Escribe un mensaje" autocomplete="off">
          <button>Enviar</button>
        </form>
      </aside>
    </div>
  </section>

  <script src="app.js?v=0.5.0"></script>
</body>
</html>
