[package]
name = "mestisexo"
version = "0.4.0"
edition = "2021"

[lib]
name = "mestisexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mestisexo-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "time"] }
