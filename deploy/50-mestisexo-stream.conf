# /etc/ssh/sshd_config.d/50-mestisexo-stream.conf
# El usuario «stream» solo puede abrir una conexión al repetidor (127.0.0.1:8091).
Match User stream
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8091
    PermitListen none
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    ForceCommand /bin/false
