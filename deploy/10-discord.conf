# /etc/systemd/system/mestisexo-repeater.service.d/10-discord.conf
# Exige iniciar sesión con Discord para ver el stream. Instálalo cuando
# /etc/mestisexo/auth.env tenga las claves de Discord.
[Service]
ExecStart=
ExecStart=/usr/local/bin/mestisexo-repeater --listen 0.0.0.0:8090 --upstream 127.0.0.1:8091 --max-viewers 500 --auth-internal 127.0.0.1:8093 --auth-url https://109-123-252-126.sslip.io
